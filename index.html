<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rubrica di Nicolas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    
    <header class="container">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center">
                    Rubrica di Nicolas
                </h1>
            </div>
        </div>
    </header>
<!-- buttons -->
<section class="container-fluid my-5">
    <div class="row">
        <article class="col-12 col-md-4">
            <h3 class="text-center mb-3">Mostra Contatti in Rubrica</h3>
            <button id="showContactsBtn" class="btn btn-custom">Mostra Contatti</button>
        </article>





        <article class="col-12 col-md-4">
          <div class="row">

            <div class="col-12 ">
                <h3 class="text-center mb-3">Aggiungi nuovo Contatto</h3>
            </div>


                <div class="col-6">
                    <div class="input-group mb-3">
                        <input type="text" id="nameInput" class="form-control" placeholder="Username">
                    </div>
                    <div class="input-group mb-3">
                        <input type="number" id="numberInput" class="form-control" placeholder="Phone Number" >
                    </div>
                </div>


                    <div class="col-6">
                        <button id="addContactsBtn" class="btn btn-custom">Aggiungi Contatto</button>
                        <button id="removeContactsBtn" class="btn btn-custom mt-2">Rimuovi Contatto</button>
                    </div>
            </div>
        </article>






        <article class="col-12 col-md-4">
            Cerca Contatto
        </article>
    </div>
</section>




<!-- Cards -->

<section class="container">
    <div class="row justify-content-center">
        <article id="contactsWrapper" class="col-12 col-md-8">
          
        </article>
    </div>
</section>






    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/66e6b89582.js" crossorigin="anonymous"></script>

    <script src="main.js"></script>
  </body>
</html>
